<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive NNC Events SaaS product prototype" />
    <title>NNC Events Prototype</title>
    <style>
:root {
  --bg: #f5f7f9;
  --surface: #ffffff;
  --surface-subtle: #f8fafb;
  --surface-strong: #edf1f4;
  --ink: #18222c;
  --muted: #64717d;
  --muted-2: #88939d;
  --line: #dbe1e6;
  --line-strong: #c7d0d8;
  --blue: #1769aa;
  --blue-soft: #e8f2fa;
  --teal: #087f6b;
  --teal-soft: #e6f5f1;
  --amber: #9a6400;
  --amber-soft: #fff4d6;
  --red: #b73535;
  --red-soft: #fdecec;
  --violet: #6c4fc2;
  --violet-soft: #f0edfb;
  --shadow: 0 8px 28px rgba(22, 34, 45, 0.12);
  --topbar: 58px;
  --sidebar: 240px;
  --radius: 6px;
  font-family: "Avenir Next", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}

* {
  box-sizing: border-box;
  letter-spacing: 0;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  font-size: 14px;
  line-height: 1.45;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgba(23, 105, 170, 0.24);
  outline-offset: 2px;
}

svg {
  width: 18px;
  height: 18px;
  stroke-width: 1.8;
  flex: 0 0 auto;
}

.app-shell {
  min-height: 100vh;
}

.topbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 50;
  height: var(--topbar);
  display: grid;
  grid-template-columns: var(--sidebar) 1fr auto;
  align-items: center;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.brand-lockup,
.topbar-center,
.topbar-actions {
  height: 100%;
  display: flex;
  align-items: center;
}

.brand-lockup {
  padding: 0 14px;
  border-right: 1px solid var(--line);
}

.brand-button {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 0;
  background: transparent;
  padding: 6px;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 5px;
  color: #fff;
  background: #123f60;
  font-weight: 800;
}

.brand-name {
  font-size: 16px;
  font-weight: 750;
}

.topbar-center {
  padding: 0 18px;
  position: relative;
}

.workspace-switcher {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 230px;
  border: 0;
  background: transparent;
  padding: 6px 8px;
  border-radius: var(--radius);
  text-align: left;
}

.workspace-switcher:hover,
.brand-button:hover,
.avatar-button:hover,
.icon-button:hover,
.search-button:hover {
  background: var(--surface-strong);
}

.workspace-switcher > span:nth-child(2) {
  display: grid;
  flex: 1;
  min-width: 0;
}

.workspace-switcher strong,
.workspace-switcher small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.workspace-switcher small,
.event-context small,
.menu-row small {
  color: var(--muted);
  font-size: 11px;
}

.workspace-avatar,
.event-context-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 5px;
  background: var(--teal-soft);
  color: var(--teal);
  font-size: 11px;
  font-weight: 800;
}

.workspace-avatar.alt {
  background: var(--violet-soft);
  color: var(--violet);
}

.popover {
  position: absolute;
  top: 50px;
  left: 18px;
  z-index: 80;
  width: 300px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.menu-row {
  width: 100%;
  min-height: 46px;
  display: grid;
  grid-template-columns: 32px 1fr 20px;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  border-radius: 4px;
  padding: 6px 8px;
  text-align: left;
}

.menu-row span:nth-child(2) {
  display: grid;
}

.menu-row:hover,
.menu-row.selected {
  background: var(--surface-subtle);
}

.menu-row.command {
  grid-template-columns: 32px 1fr;
  border-top: 1px solid var(--line);
  margin-top: 4px;
  padding-top: 8px;
}

.topbar-actions {
  justify-content: flex-end;
  gap: 5px;
  padding: 0 14px;
}

.icon-button,
.avatar-button {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
}

.avatar-button {
  border-radius: 50%;
  background: #263746;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}

.avatar-button:hover {
  background: #314859;
}

.has-indicator::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  border: 2px solid var(--surface);
  transform: translate(8px, -8px);
}

.has-indicator {
  position: relative;
}

.search-button {
  min-width: 190px;
  height: 36px;
  display: grid;
  grid-template-columns: 20px 1fr auto;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
  padding: 0 9px;
  text-align: left;
  color: var(--muted);
}

kbd {
  padding: 1px 5px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  box-shadow: 0 1px 0 var(--line-strong);
}

.sidebar {
  position: fixed;
  top: var(--topbar);
  bottom: 0;
  left: 0;
  z-index: 40;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  background: #f0f3f5;
  border-right: 1px solid var(--line);
  overflow-y: auto;
}

.primary-nav {
  padding: 10px;
}

.nav-group {
  display: grid;
  gap: 2px;
}

.nav-item {
  width: 100%;
  height: 36px;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  padding: 0 9px;
  color: #475560;
  text-align: left;
}

.nav-item span:nth-child(2) {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-item:hover {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.65);
}

.nav-item.active {
  color: #0e588f;
  background: #fff;
  box-shadow: inset 3px 0 0 var(--blue);
  font-weight: 700;
}

.nav-count {
  min-width: 22px;
  height: 20px;
  display: grid;
  place-items: center;
  border-radius: 4px;
  background: #dfe5e9;
  color: var(--muted);
  font-size: 11px;
}

.nav-divider {
  height: 1px;
  background: var(--line);
  margin: 11px 2px;
}

.nav-label {
  margin: 0 9px 6px;
  color: var(--muted-2);
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
}

.event-context {
  width: 100%;
  min-height: 52px;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) 18px;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 6px 8px;
  text-align: left;
  margin-bottom: 8px;
}

.event-context > span:nth-child(2) {
  display: grid;
  min-width: 0;
}

.event-context strong,
.event-context small {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  border-top: 1px solid var(--line);
}

.main-content {
  margin-left: var(--sidebar);
  padding-top: var(--topbar);
  min-height: 100vh;
}

.page {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 26px 30px 56px;
}

.page-header {
  min-height: 64px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.page-header h1,
.page-header h2,
.panel-title,
.modal h2,
.wizard-title {
  margin: 0;
  color: var(--ink);
}

.page-header h1 {
  font-size: 25px;
  line-height: 1.25;
}

.page-header p {
  max-width: 720px;
  margin: 5px 0 0;
  color: var(--muted);
}

.page-actions,
.inline-actions,
.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.button {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 0 12px;
  font-weight: 700;
  white-space: nowrap;
}

.button:hover {
  background: var(--surface-subtle);
  border-color: #aeb9c2;
}

.button.primary {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}

.button.primary:hover {
  background: #125b94;
}

.button.danger {
  border-color: #dbb3b3;
  color: var(--red);
}

.button.ghost {
  border-color: transparent;
  background: transparent;
}

.button.small {
  min-height: 30px;
  padding: 0 9px;
  font-size: 12px;
}

.button.icon-only {
  width: 36px;
  padding: 0;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 23px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface-strong);
  color: #4c5a65;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}

.status.success { background: var(--teal-soft); color: var(--teal); }
.status.warning { background: var(--amber-soft); color: var(--amber); }
.status.danger { background: var(--red-soft); color: var(--red); }
.status.info { background: var(--blue-soft); color: var(--blue); }
.status.violet { background: var(--violet-soft); color: var(--violet); }

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}

.metric-card {
  min-height: 112px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-content: space-between;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 15px;
}

.metric-card .metric-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.metric-card strong {
  display: block;
  margin-top: 5px;
  font-size: 25px;
  line-height: 1;
}

.metric-card .metric-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 5px;
  background: var(--blue-soft);
  color: var(--blue);
}

.metric-foot {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: 11px;
}

.delta-up { color: var(--teal); font-weight: 750; }
.delta-down { color: var(--red); font-weight: 750; }

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.8fr);
  gap: 20px;
  align-items: start;
}

.content-grid > *,
.section-panel,
.panel-body {
  min-width: 0;
}

.section-panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}

.section-panel + .section-panel {
  margin-top: 18px;
}

.panel-header {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 15px;
  border-bottom: 1px solid var(--line);
}

.panel-title {
  font-size: 15px;
}

.panel-subtitle {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.panel-body {
  padding: 15px;
}

.panel-body.flush {
  padding: 0;
}

.data-table-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  table-layout: fixed;
}

.data-table th,
.data-table td {
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

.data-table th {
  background: var(--surface-subtle);
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}

.data-table tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover {
  background: #fbfcfd;
}

.data-table .row-title {
  display: grid;
  gap: 2px;
  font-weight: 700;
}

.data-table .row-title small,
.cell-muted {
  color: var(--muted);
  font-size: 11px;
}

.table-action {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 4px;
  background: transparent;
}

.table-action:hover { background: var(--surface-strong); }

.progress-track {
  width: 100%;
  height: 7px;
  overflow: hidden;
  border-radius: 4px;
  background: #e4e9ed;
}

.progress-bar {
  height: 100%;
  border-radius: inherit;
  background: var(--blue);
}

.progress-bar.teal { background: var(--teal); }
.progress-bar.amber { background: #cf8a0a; }
.progress-bar.red { background: var(--red); }
.progress-bar.violet { background: var(--violet); }

.readiness-score {
  display: grid;
  grid-template-columns: 74px 1fr;
  align-items: center;
  gap: 14px;
}

.score-ring {
  --value: 72%;
  width: 74px;
  height: 74px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--blue) var(--value), #e4e9ed 0);
  position: relative;
}

.score-ring::after {
  content: "";
  position: absolute;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--surface);
}

.score-ring strong {
  position: relative;
  z-index: 1;
  font-size: 18px;
}

.check-list,
.attention-list,
.activity-list,
.integration-list {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.check-row,
.attention-row,
.activity-row,
.integration-row {
  display: grid;
  align-items: start;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.check-row:last-child,
.attention-row:last-child,
.activity-row:last-child,
.integration-row:last-child { border-bottom: 0; }

.check-row { grid-template-columns: 22px 1fr auto; }
.attention-row { grid-template-columns: 10px 1fr auto; }
.activity-row { grid-template-columns: 30px 1fr auto; }
.integration-row { grid-template-columns: 44px 1fr auto; align-items: center; }

.check-icon,
.activity-icon,
.integration-icon {
  display: grid;
  place-items: center;
  border-radius: 5px;
}

.check-icon {
  width: 20px;
  height: 20px;
  color: var(--teal);
}

.check-icon.pending { color: var(--muted-2); }
.check-icon.warning { color: var(--amber); }

.activity-icon,
.integration-icon {
  width: 30px;
  height: 30px;
  background: var(--surface-strong);
  color: var(--muted);
}

.integration-logo {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  padding: 8px;
}

.integration-logo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.attention-dot {
  width: 8px;
  height: 8px;
  margin-top: 6px;
  border-radius: 50%;
  background: var(--amber);
}

.attention-dot.red { background: var(--red); }
.attention-dot.blue { background: var(--blue); }

.row-copy {
  min-width: 0;
}

.row-copy strong,
.row-copy span {
  display: block;
}

.row-copy span,
.row-copy small {
  color: var(--muted);
  font-size: 12px;
}

.toolbar {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.filter-group,
.segmented {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}

.segment {
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  padding: 0 9px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.segment.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(22, 34, 45, 0.1);
  font-weight: 700;
}

.field {
  display: grid;
  gap: 6px;
}

.field + .field { margin-top: 14px; }

.field label,
.field-label {
  color: #35424d;
  font-size: 12px;
  font-weight: 750;
}

.field input,
.field select,
.field textarea,
.search-field {
  width: 100%;
  min-height: 38px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 8px 10px;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

.field small,
.help-text {
  color: var(--muted);
  font-size: 11px;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.checkbox-row,
.toggle-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
}

.checkbox-row input { margin-top: 3px; }

.switch {
  width: 36px;
  height: 20px;
  padding: 2px;
  border: 0;
  border-radius: 10px;
  background: #cbd3d9;
}

.switch::after {
  content: "";
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.18);
  transition: transform 140ms ease;
}

.switch.on { background: var(--blue); }
.switch.on::after { transform: translateX(16px); }

.event-row-cover,
.template-thumb {
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 5px;
  color: #fff;
  font-weight: 800;
}

.event-row-cover {
  width: 42px;
  height: 32px;
  background: #184b6c;
}

.event-row-title {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
}

.event-row-title > span:last-child { min-width: 0; }

.template-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.template-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  text-align: left;
  padding: 0;
}

.template-card.selected {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(23, 105, 170, 0.15);
}

.template-thumb {
  aspect-ratio: 16 / 8;
  border-radius: 0;
  background: #284e65;
  position: relative;
}

.template-thumb::before,
.template-thumb::after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,.92);
}

.template-thumb::before {
  width: 48%;
  height: 8px;
  left: 12%;
  top: 28%;
}

.template-thumb::after {
  width: 28%;
  height: 22px;
  left: 12%;
  top: 48%;
}

.template-thumb.green { background: #1d665f; }
.template-thumb.violet { background: #514274; }
.template-thumb.orange { background: #80502d; }
.template-thumb.gray { background: #58636d; }

.template-copy {
  display: grid;
  gap: 2px;
  padding: 10px 11px 12px;
}

.template-copy small { color: var(--muted); }

.builder-layout {
  min-height: calc(100vh - 170px);
  display: grid;
  grid-template-columns: 210px minmax(420px, 1fr) 280px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}

.builder-sidebar,
.builder-properties {
  background: var(--surface-subtle);
  padding: 14px;
}

.builder-sidebar { border-right: 1px solid var(--line); }
.builder-properties { border-left: 1px solid var(--line); }

.builder-sidebar h3,
.builder-properties h3 {
  margin: 0 0 12px;
  font-size: 13px;
}

.block-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.block-button {
  min-height: 62px;
  display: grid;
  place-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
  font-size: 11px;
}

.block-button:hover { border-color: var(--blue); color: var(--blue); }

.builder-canvas {
  padding: 28px;
  background: #e8ecef;
  overflow: auto;
}

.form-canvas,
.website-canvas {
  max-width: 680px;
  min-height: 620px;
  margin: 0 auto;
  border: 1px solid #cdd4da;
  background: #fff;
  box-shadow: 0 4px 16px rgba(22,34,45,.08);
}

.form-canvas { padding: 32px; }

.canvas-header {
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
}

.canvas-header h2 { margin: 0 0 5px; font-size: 22px; }
.canvas-header p { margin: 0; color: var(--muted); }

.form-block {
  position: relative;
  padding: 11px;
  border: 1px solid transparent;
  border-radius: 4px;
  margin: 0 -11px 8px;
}

.form-block:hover,
.form-block.selected { border-color: var(--blue); background: #f7fbff; }

.form-block .drag-handle {
  position: absolute;
  left: -22px;
  top: 17px;
  color: var(--muted-2);
}

.website-hero {
  min-height: 250px;
  display: flex;
  align-items: flex-end;
  padding: 34px;
  background-color: #1d4d66;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 36px 36px;
  color: #fff;
}

.website-hero h2 { margin: 0; max-width: 500px; font-size: 32px; line-height: 1.15; }
.website-hero p { margin: 9px 0 18px; color: rgba(255,255,255,.82); }
.website-section { padding: 28px 34px; }
.website-section h3 { font-size: 19px; margin: 0 0 12px; }

.agenda-preview-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}

.agenda-preview-card {
  min-height: 90px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-subtle);
}

.color-swatches {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.swatch {
  width: 28px;
  height: 28px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px var(--line-strong);
}

.swatch.selected { box-shadow: 0 0 0 2px var(--blue); }

.tabs {
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 44px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}

.tab {
  align-self: stretch;
  display: flex;
  align-items: center;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  padding: 0 1px;
  white-space: nowrap;
}

.tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 750; }

.agenda-layout {
  display: grid;
  grid-template-columns: 90px repeat(3, minmax(180px, 1fr));
  min-width: 760px;
}

.agenda-cell {
  min-height: 70px;
  padding: 9px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.agenda-time { color: var(--muted); font-size: 12px; background: var(--surface-subtle); }
.session-block { border-left: 3px solid var(--blue); background: var(--blue-soft); border-radius: 4px; padding: 9px; }
.session-block.green { border-left-color: var(--teal); background: var(--teal-soft); }
.session-block.violet { border-left-color: var(--violet); background: var(--violet-soft); }
.session-block strong { display: block; font-size: 12px; }
.session-block small { color: var(--muted); }

.chart-wrap {
  min-height: 250px;
  display: grid;
  align-items: end;
  grid-template-columns: repeat(8, minmax(30px, 1fr));
  gap: 12px;
  padding: 24px 12px 8px;
  border-left: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.chart-column {
  height: 210px;
  display: grid;
  grid-template-rows: 1fr 22px;
  gap: 6px;
  align-items: end;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
}

.chart-bar {
  width: 100%;
  max-width: 38px;
  min-height: 3px;
  margin: auto auto 0;
  border-radius: 3px 3px 0 0;
  background: var(--blue);
}

.donut-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 18px;
  align-items: center;
}

.donut {
  width: 112px;
  height: 112px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--teal) 0 58%, var(--blue) 58% 78%, var(--violet) 78% 91%, #dfe5e9 91%);
  position: relative;
}

.donut::after {
  content: "";
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--surface);
  position: absolute;
}

.donut strong { position: relative; z-index: 1; }

.legend {
  display: grid;
  gap: 8px;
}

.legend-row {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 8px;
  align-items: center;
}

.legend-dot { width: 9px; height: 9px; border-radius: 2px; background: var(--teal); }
.legend-dot.blue { background: var(--blue); }
.legend-dot.violet { background: var(--violet); }
.legend-dot.gray { background: #dfe5e9; }

.device-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.device-card {
  min-height: 112px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: var(--surface);
}

.device-card header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.device-card p { color: var(--muted); margin: 10px 0 0; font-size: 12px; }

.usage-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.usage-item {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.usage-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.usage-head span:last-child { color: var(--muted); }

.empty-state {
  min-height: 280px;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 30px;
}

.empty-state .empty-icon {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-strong);
  color: var(--muted);
  margin: 0 auto 12px;
}

.empty-state h3 { margin: 0 0 4px; }
.empty-state p { margin: 0 auto 16px; max-width: 380px; color: var(--muted); }

.modal-backdrop,
.command-backdrop,
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(16, 26, 35, 0.5);
}

.modal-backdrop,
.command-backdrop {
  display: grid;
  place-items: center;
  padding: 18px;
}

.modal {
  width: min(760px, 96vw);
  max-height: min(860px, 92vh);
  display: flex;
  flex-direction: column;
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.modal.large { width: min(1040px, 96vw); }

.modal-header,
.modal-footer {
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
}

.modal-header { border-bottom: 1px solid var(--line); }
.modal-footer { border-top: 1px solid var(--line); justify-content: flex-end; }
.modal-body { padding: 20px; overflow-y: auto; }

.modal-close {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
}
.modal-close:hover { background: var(--surface-strong); }

button:active:not(:disabled) { transform: translateY(1px); }

.wizard-layout {
  display: grid;
  grid-template-columns: 190px 1fr;
  min-height: 530px;
}

.wizard-steps {
  padding: 18px 14px;
  background: var(--surface-subtle);
  border-right: 1px solid var(--line);
}

.wizard-step {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 8px;
  align-items: center;
  min-height: 50px;
  color: var(--muted);
}

.step-number {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--surface);
  font-size: 11px;
  font-weight: 800;
}

.wizard-step.active { color: var(--blue); font-weight: 750; }
.wizard-step.active .step-number { background: var(--blue); color: #fff; border-color: var(--blue); }
.wizard-step.complete .step-number { background: var(--teal); color: #fff; border-color: var(--teal); }

.wizard-content { padding: 24px; }
.wizard-title { font-size: 20px; }
.wizard-intro { margin: 5px 0 22px; color: var(--muted); }

.review-list {
  display: grid;
  gap: 10px;
}

.review-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.review-item > i { color: var(--teal); }

.command-palette {
  width: min(620px, 94vw);
  max-height: 72vh;
  margin-top: -18vh;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.command-input-wrap {
  min-height: 58px;
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 10px;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
}

.command-input-wrap input { height: 48px; border: 0; outline: 0; font-size: 15px; }
.command-results { max-height: 460px; overflow-y: auto; padding: 8px; }

.command-result {
  width: 100%;
  min-height: 48px;
  display: grid;
  grid-template-columns: 32px 1fr auto;
  align-items: center;
  gap: 9px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  padding: 7px 9px;
  text-align: left;
}

.command-result:hover { background: var(--surface-subtle); }
.command-result small { color: var(--muted); }

.toast-region {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 200;
  display: grid;
  gap: 8px;
}

.toast {
  min-width: 290px;
  max-width: 380px;
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 9px;
  align-items: center;
  border: 1px solid #a8d5ca;
  border-radius: var(--radius);
  background: #f4fcfa;
  box-shadow: var(--shadow);
  padding: 11px 12px;
}

.toast > i { color: var(--teal); }

.mobile-only { display: none; }

[hidden] { display: none !important; }

@media (max-width: 1180px) {
  .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content-grid { grid-template-columns: 1fr; }
  .builder-layout { grid-template-columns: 190px 1fr; }
  .builder-properties { display: none; }
  .device-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 900px) {
  :root { --sidebar: 0px; }
  .topbar { grid-template-columns: auto 1fr auto; }
  .brand-lockup { border-right: 0; padding-left: 8px; }
  .brand-name { display: none; }
  .mobile-only { display: grid; }
  .topbar-center { padding: 0 4px; min-width: 0; }
  .workspace-switcher { min-width: 0; max-width: 240px; }
  .workspace-switcher small { display: none; }
  .search-button { min-width: 36px; width: 36px; padding: 0; place-items: center; }
  .search-button span,
  .search-button kbd,
  .topbar-actions .icon-button[data-action="help"] { display: none; }
  .sidebar {
    width: 250px;
    transform: translateX(-102%);
    transition: transform 180ms ease;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .drawer-backdrop { z-index: 35; }
  .main-content { margin-left: 0; }
  .page { padding: 22px 18px 48px; }
  .page-header { align-items: stretch; flex-direction: column; }
  .page-actions { justify-content: flex-start; }
}

@media (max-width: 680px) {
  .workspace-switcher > span:nth-child(2) { display: none; }
  .workspace-switcher { min-width: auto; }
  .topbar-actions { padding-right: 8px; }
  .topbar-actions .icon-button[data-route="attention"] { display: none; }
  .page { padding: 18px 12px 40px; }
  .page-header h1 { font-size: 22px; }
  .metric-grid,
  .field-grid,
  .template-grid,
  .usage-grid,
  .device-grid { grid-template-columns: 1fr; }
  .metric-card { min-height: 98px; }
  .builder-layout { grid-template-columns: 1fr; min-height: auto; }
  .builder-sidebar { display: none; }
  .builder-canvas { padding: 12px; }
  .form-canvas { padding: 20px 16px; min-height: 560px; }
  .website-hero { padding: 24px 20px; }
  .website-hero h2 { font-size: 26px; }
  .website-section { padding: 22px 20px; }
  .agenda-preview-grid { grid-template-columns: 1fr; }
  .wizard-layout { grid-template-columns: 1fr; }
  .wizard-steps {
    display: flex;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
  }
  .wizard-step { min-width: 42px; grid-template-columns: 26px; }
  .wizard-step span:last-child { display: none; }
  .wizard-content { padding: 18px; }
  .modal-backdrop { padding: 0; align-items: end; }
  .modal { width: 100%; max-height: 94vh; border-radius: 8px 8px 0 0; }
  .toolbar { align-items: stretch; flex-direction: column; }
  .toolbar-actions { width: 100%; }
  .toolbar-actions .search-field { flex: 1; }
  .donut-row { grid-template-columns: 1fr; }
  .toast-region { left: 10px; right: 10px; bottom: 10px; }
  .toast { min-width: 0; max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

function statusBadge(value) {
  const map = {
    Live: 'success',
    Confirmed: 'success',
    Connected: 'success',
    Healthy: 'success',
    Scheduled: 'info',
    'Registration open': 'info',
    Draft: 'warning',
    'Profile incomplete': 'warning',
    Waitlisted: 'violet',
    Failed: 'danger',
    Attention: 'danger'
  };
  return `<span class="status ${map[value] || ''}">${value}</span>`;
}

function pageHeader(title, description, actions = '') {
  return `
    <header class="page-header">
      <div>
        <h1>${title}</h1>
        ${description ? `<p>${description}</p>` : ''}
      </div>
      <div class="page-actions">${actions}</div>
    </header>
  `;
}

function metricCard(label, value, detail, iconName, tone = '') {
  return `
    <article class="metric-card">
      <div>
        <span class="metric-label">${label}</span>
        <strong>${value}</strong>
      </div>
      <span class="metric-icon ${tone}">${icon(iconName)}</span>
      <div class="metric-foot">${detail}</div>
    </article>
  `;
}

function eventRow(event) {
  const tone = event.status === 'Live' ? 'success' : event.status === 'Draft' ? 'warning' : 'info';

  return `
    <tr>
      <td>
        <div class="event-row-title">
          <span class="event-row-cover">${event.initials}</span>
          <span class="row-title">${event.name}<small>${event.type} · ${event.city}</small></span>

      </td>
      <td>${event.date}</td>
      <td><span class="status ${tone}" title="${event.status}">${statusLabel}</span></td>

      <td>
        <div style="display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center">

      <td><button class="table-action" data-route="event-overview" aria-label="Open ${event.name}" title="Open event">${icon('arrow-right')}</button></td>

}

function skeletonView() {

}

function render(route = state.route, immediate = false) {
  state.route = views[route] ? route : 'home';
  const main = document.getElementById('mainContent');
  const eventContext = document.getElementById('eventContextButton');
  const eventInitials = state.eventName.split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase();
  eventContext.querySelector('.event-context-mark').textContent = eventInitials;
  eventContext.querySelector('strong').textContent = state.eventName;
  eventContext.querySelector('strong').title = state.eventName;
  eventContext.querySelector('small').textContent = `${state.eventStatus} · 18 Sep 2026`;
  document.querySelectorAll('[data-route]').forEach(item => item.classList.toggle('active', item.dataset.route === state.route));
  const draw = () => {
    main.innerHTML = views[state.route]();
    main.focus({ preventScroll: true });
    initIcons();
    closeMobileNav();
  };
  if (immediate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    draw();
  } else {
    main.innerHTML = skeletonView();
    window.setTimeout(draw, 90);
  }
  window.history.replaceState({}, '', `#${state.route}`);
}

function showToast(message) {
  const region = document.getElementById('toastRegion');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `${icon('circle-check')}<span>${message}</span><button class="table-action" aria-label="Dismiss">${icon('x', 15)}</button>`;
  region.appendChild(toast);
  initIcons();
  toast.querySelector('button').addEventListener('click', () => toast.remove());
  window.setTimeout(() => toast.remove(), 4200);
}

function openModal(content, large = false) {
  const backdrop = document.getElementById('modalBackdrop');
  const modal = document.getElementById('modal');
  modal.className = `modal ${large ? 'large' : ''}`;
  modal.innerHTML = content;
  backdrop.hidden = false;
  document.body.style.overflow = 'hidden';
  initIcons();
  modal.querySelector('button, input, select')?.focus();
}

function closeModal() {
  document.getElementById('modalBackdrop').hidden = true;
  document.body.style.overflow = '';
}

      <div class="modal-body" style="background:#e8ecef"><article class="website-canvas"><section class="website-hero"><div><span style="font-size:12px;font-weight:750">18-19 September 2026 · Dubai</span><h2>${state.eventName}</h2><p>Where retail, technology, and customer experience leaders make the next market.</p><button class="button primary">Register now</button></div></section><section class="website-section"><h3>Build the next customer experience</h3><p style="color:var(--muted)">Two focused days of practical sessions, qualified meetings, and product demonstrations for commerce leaders.</p></section></article></div>
    <div class="modal-footer"><button class="button" data-action="close-modal">Close</button><button class="button primary" data-route="website">Open builder</button></div>
  `;
}

function publishModal() {
  return `
    <div class="modal-header"><div><h2 id="modalTitle">Publish ${state.eventName}?</h2><p class="panel-subtitle">The public website and registration will become available.</p></div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="review-list">
        <div class="review-item"><i data-lucide="circle-check"></i><span><strong>Registration test completed</strong><small style="display:block;color:var(--muted)">Ticket, payment, confirmation, and QR issuance passed</small></span><span class="status success">Ready</span></div>
        <div class="review-item"><i data-lucide="triangle-alert" style="color:var(--amber)"></i><span><strong>Sending domain needs attention</strong><small style="display:block;color:var(--muted)">Transactional mail will use the shared NNC domain until resolved</small></span><span class="status warning">Fallback</span></div>
        <div class="review-item"><i data-lucide="triangle-alert" style="color:var(--amber)"></i><span><strong>186 profiles remain incomplete</strong><small style="display:block;color:var(--muted)">Credentials remain gated until required fields are complete</small></span><span class="status warning">Protected</span></div>
      </div>
      <label class="checkbox-row" style="margin-top:18px"><input type="checkbox" id="publishConfirm" /><span>I understand the fallback conditions and approve publishing.</span></label>
      <p class="help-text" id="publishError" style="color:var(--red);display:none">Confirm the fallback conditions before publishing.</p>
    </div>
    <div class="modal-footer"><button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="confirm-publish">Publish event</button></div>
  `;
}

function ticketModal() {
  return `
    <div class="modal-header"><div><h2 id="modalTitle">Add ticket tier</h2><p class="panel-subtitle">Inventory and price are independently governed.</p></div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body"><div class="field-grid"><div class="field"><label>Ticket name</label><input id="newTicketName" value="Community pass" aria-label="Ticket name" /></div><div class="field"><label>Capacity</label><input type="number" value="240" aria-label="Ticket capacity" /></div><div class="field"><label>Price</label><input type="number" value="450" aria-label="Ticket price" /></div><div class="field"><label>Currency</label><select aria-label="Ticket currency"><option>AED</option><option>USD</option><option>EUR</option></select></div></div><div class="field"><label>Availability</label><select aria-label="Ticket availability"><option>Public</option><option>Invite only</option><option>Hidden</option></select></div><div class="field"><label>Profile requirements</label><div class="toggle-row"><button class="switch on" data-action="toggle" aria-label="Require profile"></button><span class="help-text">Gate credential until required attendee profile is complete</span></div></div></div>
    <div class="modal-footer"><button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="save-ticket">Add ticket</button></div>
  `;
}

function campaignModal() {
  return `
    <div class="modal-header"><div><h2 id="modalTitle">Create campaign</h2><p class="panel-subtitle">Audience preview uses current consent and suppression state.</p></div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body"><div class="field"><label>Campaign name</label><input value="Final agenda announcement" aria-label="Campaign name" /></div><div class="field-grid"><div class="field"><label>Channel</label><select aria-label="Campaign channel"><option>Email</option><option>WhatsApp</option><option>Push notification</option></select></div><div class="field"><label>Audience</label><select aria-label="Campaign audience"><option>Confirmed attendees</option><option>Executive ticket</option><option>Profile incomplete</option></select></div></div><div class="field"><label>Subject</label><input value="Your Future of Commerce agenda is ready" aria-label="Campaign subject" /></div><div class="field"><label>Delivery</label><select aria-label="Campaign delivery"><option>Schedule</option><option>Send after approval</option><option>Save as draft</option></select></div><div class="review-item" style="margin-top:16px"><i data-lucide="users"></i><span><strong>1,716 deliverable recipients</strong><small style="display:block;color:var(--muted)">126 suppressed, unsubscribed, or missing consent</small></span><button class="button small">Preview</button></div></div>
    <div class="modal-footer"><button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="save-campaign">Create campaign</button></div>
  `;
}

function createEventModal() {
  const steps = ['Start', 'Event details', 'Brand & access', 'Commerce', 'Review'];
  const stepMarkup = steps.map((label, index) => {
    const number = index + 1;
    const stepClass = number === state.wizardStep ? 'active' : number < state.wizardStep ? 'complete' : '';
    return `<div class="wizard-step ${stepClass}"><span class="step-number">${number < state.wizardStep ? icon('check', 14) : number}</span><span>${label}</span></div>`;
  }).join('');
  let body = '';
  if (state.wizardStep === 1) {
    body = `<h3 class="wizard-title">Choose a starting point</h3><p class="wizard-intro">Templates carry approved structure, rules, and readiness checks.</p><div class="template-grid"><button class="template-card selected" data-template="Conference"><span class="template-thumb"></span><span class="template-copy"><strong>Conference</strong><small>Tickets, agenda, speakers, sponsors</small></span></button><button class="template-card" data-template="Field event"><span class="template-thumb green"></span><span class="template-copy"><strong>Field event</strong><small>Compact registration and check-in</small></span></button><button class="template-card" data-template="Webinar"><span class="template-thumb orange"></span><span class="template-copy"><strong>Webinar</strong><small>Live session and on-demand</small></span></button></div>`;
  } else if (state.wizardStep === 2) {
    body = `<h3 class="wizard-title">Define the event</h3><p class="wizard-intro">These details become the canonical event record.</p><div class="field"><label>Event name</label><input id="wizardName" value="${state.wizardData.name}" aria-label="Event name" /><small id="wizardNameError" style="color:var(--red);display:none">Enter an event name.</small></div><div class="field-grid"><div class="field"><label>Format</label><select id="wizardFormat" aria-label="Event format"><option>In-person</option><option>Hybrid</option><option>Virtual</option><option>Webinar</option></select></div><div class="field"><label>Timezone</label><select id="wizardTimezone" aria-label="Event timezone"><option>Asia/Dubai</option><option>Asia/Tbilisi</option><option>Europe/London</option></select></div><div class="field"><label>Start date</label><input type="date" value="2026-11-12" aria-label="Event start date" /></div><div class="field"><label>Capacity</label><input id="wizardCapacity" type="number" value="${state.wizardData.capacity}" aria-label="Event capacity" /></div></div>`;
  } else if (state.wizardStep === 3) {
    body = `<h3 class="wizard-title">Brand and access</h3><p class="wizard-intro">Configure the public identity and initial team access.</p><div class="field"><label>Primary color</label><div class="color-swatches"><button class="swatch selected" data-color="#1769aa" style="background:#1769aa" aria-label="Blue"></button><button class="swatch" data-color="#087f6b" style="background:#087f6b" aria-label="Teal"></button><button class="swatch" data-color="#80502d" style="background:#80502d" aria-label="Copper"></button><button class="swatch" data-color="#514274" style="background:#514274" aria-label="Violet"></button></div></div><div class="field"><label>Domain</label><input id="wizardDomain" value="${state.wizardData.domain}" aria-label="Event domain" /><small>Ownership will be verified before production publish.</small></div><div class="field"><label>Team access</label><label class="checkbox-row"><input id="wizardInvite" type="checkbox" checked /><span>Invite workspace event managers after creation</span></label></div>`;
  } else if (state.wizardStep === 4) {
    body = `<h3 class="wizard-title">Registration and commerce</h3><p class="wizard-intro">Start simple, then add rules and additional tiers from the event workspace.</p><div class="field"><label>Registration model</label><div class="segmented"><button class="segment">Free RSVP</button><button class="segment active">Paid tickets</button><button class="segment">Approval required</button></div></div><div class="field-grid"><div class="field"><label>Initial ticket name</label><input id="wizardTicketName" value="${state.wizardData.ticketName}" aria-label="Initial ticket name" /></div><div class="field"><label>Price in AED</label><input id="wizardTicketPrice" type="number" value="${state.wizardData.ticketPrice}" aria-label="Initial ticket price in AED" /></div></div><div class="review-item" style="margin-top:16px"><i data-lucide="credit-card"></i><span><strong>Stripe connected</strong><small style="display:block;color:var(--muted)">Test payment and signed webhooks available</small></span><span class="status success">Ready</span></div>`;
  } else {
    body = `<h3 class="wizard-title">Review and create</h3><p class="wizard-intro">A draft workspace will be provisioned with reversible defaults.</p><div class="review-list"><div class="review-item"><i data-lucide="calendar-days"></i><span><strong>${state.wizardData.name}</strong><small style="display:block;color:var(--muted)">${state.wizardData.format} · Asia/Dubai · Capacity ${state.wizardData.capacity}</small></span><button class="button small" data-wizard-jump="2">Edit</button></div><div class="review-item"><i data-lucide="palette"></i><span><strong>Northstar Events brand</strong><small style="display:block;color:var(--muted)">${state.wizardData.domain}</small></span><button class="button small" data-wizard-jump="3">Edit</button></div><div class="review-item"><i data-lucide="ticket"></i><span><strong>${state.wizardData.ticketName}</strong><small style="display:block;color:var(--muted)">AED ${state.wizardData.ticketPrice} · Hosted checkout</small></span><button class="button small" data-wizard-jump="4">Edit</button></div><div class="review-item"><i data-lucide="shield-check"></i><span><strong>Tenant isolation and audit context</strong><small style="display:block;color:var(--muted)">Inherited from Northstar Events workspace policy</small></span><span class="status success">Ready</span></div></div>`;
  }
  return `
    <div class="modal-header"><div><h2 id="modalTitle">Create event</h2><p class="panel-subtitle">Northstar Events workspace</p></div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>
    <div class="wizard-layout"><aside class="wizard-steps">${stepMarkup}</aside><div class="wizard-content">${body}</div></div>
    <div class="modal-footer"><button class="button" data-action="close-modal">Cancel</button>${state.wizardStep > 1 ? '<button class="button" data-action="wizard-back">Back</button>' : ''}<button class="button primary" data-action="${state.wizardStep === 5 ? 'wizard-create' : 'wizard-next'}">${state.wizardStep === 5 ? 'Create draft event' : 'Continue'}${state.wizardStep < 5 ? icon('arrow-right', 15) : ''}</button></div>
  `;
}

function openCommandPalette() {
  const backdrop = document.getElementById('commandBackdrop');
  backdrop.hidden = false;
  const input = document.getElementById('commandInput');
  input.value = '';
  renderCommandResults('');
  window.setTimeout(() => input.focus(), 0);
}

function closeCommandPalette() {
  document.getElementById('commandBackdrop').hidden = true;
}

function renderCommandResults(query) {
  const items = [
    ['Future of Commerce 2026', 'Event', 'event-overview', 'calendar-days'],
    ['Partner Summit Dubai', 'Event', 'events', 'calendar-days'],
    ['Mariam Haddad', 'Attendee', 'attendees', 'contact-round'],
    ['Ticket tiers', 'Event settings', 'tickets', 'ticket'],
    ['Sending domain', 'Workspace configuration', 'communications', 'mail'],
    ['Plan & billing', 'Workspace configuration', 'billing', 'credit-card']
  ].filter(item => item[0].toLowerCase().includes(query.toLowerCase()) || item[1].toLowerCase().includes(query.toLowerCase()));
  document.getElementById('commandResults').innerHTML = items.length ? items.map(item => `<button class="command-result" data-command-route="${item[2]}"><span class="activity-icon">${icon(item[3], 15)}</span><span><strong>${item[0]}</strong><small style="display:block">${item[1]}</small></span>${icon('corner-down-left', 15)}</button>`).join('') : `<div class="empty-state" style="min-height:180px"><div><span class="empty-icon">${icon('search-x')}</span><h3>No matching records</h3><p>Try an event name, attendee, order, or setting.</p></div></div>`;
  initIcons();
}

function openMobileNav() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('drawerBackdrop').hidden = false;
}

function closeMobileNav() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('drawerBackdrop').hidden = true;
}

document.addEventListener('click', event => {
  const routeTarget = event.target.closest('[data-route]');
  if (routeTarget) {
    event.preventDefault();
    closeModal();
    closeCommandPalette();
    render(routeTarget.dataset.route);
    return;
  }

  const actionTarget = event.target.closest('[data-action]');
  if (!actionTarget) return;
  const action = actionTarget.dataset.action;

  if (action === 'close-modal') closeModal();
  if (action === 'create-event') {
    state.wizardStep = 1;
    openModal(createEventModal(), true);
  }
  if (action === 'preview-event') openModal(eventPreviewModal(), true);
  if (action === 'publish-event') {
    if (state.eventStatus !== 'Draft') showToast('Event is already published.');
    else openModal(publishModal());
  }
  if (action === 'confirm-publish') {
    const checkbox = document.getElementById('publishConfirm');
    if (!checkbox.checked) {
      document.getElementById('publishError').style.display = 'block';
      checkbox.focus();
    } else {
      state.eventStatus = 'Scheduled';
      closeModal();
      render('event-overview', true);
      showToast('Event published. Registration is now available.');
    }
  }
  if (action === 'add-ticket') openModal(ticketModal());
  if (action === 'save-ticket') {
    closeModal();
    showToast('Ticket tier added to the draft event.');
  }
  if (action === 'create-campaign') openModal(campaignModal());
  if (action === 'save-campaign') {
    closeModal();
    showToast('Campaign created as a draft.');
  }
  if (action === 'save') showToast('Changes saved with an audit record.');
  if (action === 'show-active-events') {
    state.archivedEvents = false;
    render('events', true);
  }
  if (action === 'show-archived-events') {
    state.archivedEvents = true;
    render('events', true);
  }
  if (action === 'simulate-checkin') {
    state.checkedIn += 1;
    render('onsite', true);
    showToast('Check-in recorded and badge print queued.');
  }
  if (action === 'rehearsal') showToast('Rehearsal started with offline-mode checks.');
  if (action === 'toggle') actionTarget.classList.toggle('on');
  if (action === 'select-form-block') {
    state.selectedBuilderBlock = actionTarget.dataset.block;
    render('registration', true);
  }
  if (action === 'wizard-next') {
    if (state.wizardStep === 2) {
      const name = document.getElementById('wizardName').value.trim();
      if (!name) {
        document.getElementById('wizardNameError').style.display = 'block';
        document.getElementById('wizardName').focus();
        return;
      }
      state.wizardData.name = name;
      state.wizardData.capacity = document.getElementById('wizardCapacity').value;
    }
    if (state.wizardStep === 3) state.wizardData.domain = document.getElementById('wizardDomain').value;
    if (state.wizardStep === 4) {
      state.wizardData.ticketName = document.getElementById('wizardTicketName').value;
      state.wizardData.ticketPrice = document.getElementById('wizardTicketPrice').value;
    }
    state.wizardStep += 1;
    openModal(createEventModal(), true);
  }
  if (action === 'wizard-back') {
    state.wizardStep -= 1;
    openModal(createEventModal(), true);
  }
  if (action === 'wizard-create') {
    state.eventName = state.wizardData.name;
    state.eventStatus = 'Draft';
    closeModal();
    render('event-overview', true);
    showToast('Draft event created with readiness checks.');
  }
});

document.addEventListener('click', event => {
  const template = event.target.closest('[data-template]');
  if (template) {
    document.querySelectorAll('[data-template]').forEach(item => item.classList.remove('selected'));
    template.classList.add('selected');
    state.wizardData.template = template.dataset.template;
  }
  const jump = event.target.closest('[data-wizard-jump]');
  if (jump) {
    state.wizardStep = Number(jump.dataset.wizardJump);
    openModal(createEventModal(), true);
  }
  const commandRoute = event.target.closest('[data-command-route]');
  if (commandRoute) {
    closeCommandPalette();
    render(commandRoute.dataset.commandRoute);
  }
  const swatch = event.target.closest('[data-color]');
  if (swatch) {
    document.querySelectorAll('[data-color]').forEach(item => item.classList.remove('selected'));
    swatch.classList.add('selected');
    state.wizardData.brandColor = swatch.dataset.color;
  }
});

document.getElementById('workspaceSwitcher').addEventListener('click', event => {
  event.stopPropagation();
  const menu = document.getElementById('workspaceMenu');
  menu.hidden = !menu.hidden;
});

document.addEventListener('click', event => {
  if (!event.target.closest('#workspaceSwitcher') && !event.target.closest('#workspaceMenu')) {
    document.getElementById('workspaceMenu').hidden = true;
  }
});

document.getElementById('searchButton').addEventListener('click', openCommandPalette);
document.getElementById('commandInput').addEventListener('input', event => renderCommandResults(event.target.value));
document.getElementById('commandBackdrop').addEventListener('click', event => {
  if (event.target.id === 'commandBackdrop') closeCommandPalette();
});
document.getElementById('modalBackdrop').addEventListener('click', event => {
  if (event.target.id === 'modalBackdrop') closeModal();
});
document.getElementById('menuButton').addEventListener('click', openMobileNav);
document.getElementById('drawerBackdrop').addEventListener('click', closeMobileNav);

document.addEventListener('keydown', event => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    openCommandPalette();
  }
  if (event.key === 'Escape') {
    closeModal();
    closeCommandPalette();
    closeMobileNav();
  }
});

const initialRoute = window.location.hash.replace('#', '');
render(views[initialRoute] ? initialRoute : 'home', true);
initIcons();

    </script>
  </body>
</html>
